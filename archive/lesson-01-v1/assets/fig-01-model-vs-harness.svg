<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="fig-01-title fig-01-desc">
  <title id="fig-01-title">只有 Model 与 Model 加 Harness 的职责对比</title>
  <desc id="fig-01-desc">左侧展示只有 Model 时只能基于现有上下文推理和生成；右侧展示 Harness 如何连接 Tool、Skill、Filesystem、Session 和 Sandbox。</desc>
  <defs>
    <marker id="fig-01-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="fig-01-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="fig-01-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#f5f5f5"/>
  <text x="64" y="44" fill="#4f5d75" font-size="12" font-family="Cascadia Mono,Consolas,monospace" letter-spacing="2">A · MODEL ONLY</text>
  <text x="540" y="44" fill="#4f5d75" font-size="12" font-family="Cascadia Mono,Consolas,monospace" letter-spacing="2">B · MODEL + HARNESS</text>
  <text x="64" y="80" fill="#2d3142" font-size="28" font-family="Georgia,Noto Serif SC,Songti SC,serif">会回答，但无法独自穿过现实</text>
  <text x="540" y="80" fill="#2d3142" font-size="28" font-family="Georgia,Noto Serif SC,Songti SC,serif">推理中心被装进一个可运行系统</text>
  <rect x="64" y="116" width="404" height="452" rx="8" fill="#ffffff" stroke="rgba(45,49,66,.16)"/>
  <rect x="540" y="116" width="596" height="452" rx="8" fill="rgba(45,49,66,.02)" stroke="#2d3142" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="556" y="128" width="236" height="24" rx="4" fill="#f5f5f5"/>
  <text x="568" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="Cascadia Mono,Consolas,monospace" letter-spacing="1">HARNESS · 组织与边界</text>
  <line x1="744" y1="308" x2="812" y2="308" stroke="#eb6c36" stroke-width="2" marker-end="url(#fig-01-arrow-accent)"/>
  <rect x="756" y="276" width="48" height="16" rx="2" fill="#f5f5f5"/>
  <text x="780" y="288" text-anchor="middle" fill="#eb6c36" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">选择动作</text>
  <line x1="812" y1="412" x2="744" y2="412" stroke="#2e5aa8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fig-01-arrow-link)"/>
  <rect x="760" y="380" width="40" height="16" rx="2" fill="#f5f5f5"/>
  <text x="780" y="392" text-anchor="middle" fill="#2e5aa8" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">历史</text>
  <line x1="1012" y1="324" x2="1012" y2="364" stroke="#2a9d8f" stroke-width="2" marker-end="url(#fig-01-arrow)"/>
  <circle cx="264" cy="304" r="92" fill="rgba(235,108,54,.10)" stroke="#eb6c36" stroke-width="3"/>
  <text x="264" y="292" text-anchor="middle" fill="#eb6c36" font-size="28" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Model</text>
  <text x="264" y="328" text-anchor="middle" fill="#2d3142" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">推理 · 生成</text>
  <rect x="128" y="436" width="272" height="76" rx="6" fill="rgba(201,76,76,.05)" stroke="rgba(201,76,76,.55)" stroke-dasharray="6 4"/>
  <text x="264" y="464" text-anchor="middle" fill="#c94c4c" font-size="16" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">缺少真实世界的“手和记忆”</text>
  <text x="264" y="492" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">不能自行取新信息、执行动作或跨轮保存状态</text>
  <circle cx="660" cy="360" r="84" fill="rgba(235,108,54,.10)" stroke="#eb6c36" stroke-width="3"/>
  <text x="660" y="348" text-anchor="middle" fill="#eb6c36" font-size="24" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Model</text>
  <text x="660" y="380" text-anchor="middle" fill="#2d3142" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">推理 · 生成</text>
  <rect x="812" y="196" width="280" height="128" rx="6" fill="rgba(42,157,143,.08)" stroke="#2a9d8f" stroke-width="2"/>
  <rect x="828" y="212" width="60" height="20" rx="2" fill="#e0f3ef" stroke="rgba(42,157,143,.45)"/>
  <text x="860" y="228" text-anchor="middle" fill="#2a9d8f" font-size="12" font-family="Cascadia Mono,Consolas,monospace">CAPABILITY</text>
  <text x="836" y="264" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Tool · Skill · Filesystem</text>
  <text x="836" y="292" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">动作、说明与工作区访问</text>
  <rect x="812" y="364" width="132" height="120" rx="6" fill="rgba(58,124,165,.08)" stroke="#3a7ca5" stroke-width="2"/>
  <rect x="828" y="380" width="52" height="20" rx="2" fill="#e3eff7" stroke="rgba(58,124,165,.45)"/>
  <text x="856" y="396" text-anchor="middle" fill="#3a7ca5" font-size="12" font-family="Cascadia Mono,Consolas,monospace">STATE</text>
  <text x="828" y="432" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Session</text>
  <text x="828" y="460" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">记录与连续性</text>
  <rect x="960" y="364" width="132" height="120" rx="6" fill="rgba(201,76,76,.04)" stroke="#c94c4c" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="976" y="380" width="60" height="20" rx="2" fill="#fff4f3" stroke="rgba(201,76,76,.45)"/>
  <text x="1008" y="396" text-anchor="middle" fill="#c94c4c" font-size="12" font-family="Cascadia Mono,Consolas,monospace">POLICY</text>
  <text x="976" y="432" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Sandbox</text>
  <text x="976" y="460" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">受控执行边界</text>
  <line x1="64" y1="612" x2="1136" y2="612" stroke="rgba(45,49,66,.12)"/>
  <text x="64" y="644" fill="#4f5d75" font-size="12" font-family="Cascadia Mono,Consolas,monospace" letter-spacing="1">READING KEY</text>
  <circle cx="196" cy="640" r="6" fill="#eb6c36"/>
  <text x="212" y="644" fill="#4f5d75" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Model 是推理焦点</text>
  <rect x="388" y="634" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-dasharray="5 3"/>
  <text x="424" y="644" fill="#4f5d75" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Harness 是组织边界</text>
  <rect x="632" y="634" width="24" height="12" rx="2" fill="rgba(42,157,143,.08)" stroke="#2a9d8f"/>
  <text x="668" y="644" fill="#4f5d75" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">能力端口</text>
  <rect x="812" y="634" width="24" height="12" rx="2" fill="rgba(58,124,165,.08)" stroke="#3a7ca5"/>
  <text x="848" y="644" fill="#4f5d75" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">持久状态</text>
  <rect x="980" y="634" width="24" height="12" rx="2" fill="rgba(201,76,76,.04)" stroke="#c94c4c" stroke-dasharray="4 3"/>
  <text x="1016" y="644" fill="#4f5d75" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">执行约束</text>
</svg>
