<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="fig-04-title fig-04-desc">
  <title id="fig-04-title">DeepSeek Harness 第一层正式架构</title>
  <desc id="fig-04-desc">CLI 与 Profile 组合 Cordis 插件树，基础插件通过 capability seams 接入环境能力，并使用 Session 事件日志保持运行连续性。</desc>
  <defs>
    <marker id="fig-04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="fig-04-arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6c63a8"/></marker>
    <marker id="fig-04-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3a7ca5"/></marker>
    <marker id="fig-04-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9d8f"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#f5f5f5"/>
  <text x="40" y="48" fill="#2d3142" font-size="28" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">DeepSeek Harness 第一层正式架构</text>
  <text x="40" y="80" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">本图只回答：启动时如何组合，运行时能力从哪里接入。内部机制留到后续课程。</text>
  <rect x="300" y="120" width="540" height="400" rx="8" fill="rgba(79,93,117,.03)" stroke="#4f5d75" stroke-width="2"/>
  <rect x="316" y="108" width="244" height="24" rx="4" fill="#f5f5f5"/>
  <text x="328" y="124" fill="#4f5d75" font-size="12" font-weight="600" font-family="Cascadia Mono,Consolas,monospace" letter-spacing="1">CORDIS CONTEXT / PLUGIN TREE</text>

  <path d="M240 300 H272 Q280 300 280 292 V236 Q280 228 288 228 H300" fill="none" stroke="#2d3142" stroke-width="2" marker-end="url(#fig-04-arrow)"/>
  <text x="244" y="260" fill="#4f5d75" font-size="12" font-family="Cascadia Mono,Consolas,monospace">boot</text>
  <path d="M570 300 V336 Q570 344 578 344 H692 Q700 344 700 352 V376" fill="none" stroke="#6c63a8" stroke-width="2" marker-end="url(#fig-04-arrow-purple)"/>
  <rect x="616" y="312" width="112" height="20" rx="2" fill="#f5f5f5"/>
  <text x="672" y="328" text-anchor="middle" fill="#6c63a8" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">provide / inject</text>
  <path d="M570 300 V336 Q570 344 562 344 H452 Q444 344 444 352 V376" fill="none" stroke="#3a7ca5" stroke-width="2" marker-end="url(#fig-04-arrow-blue)"/>
  <rect x="476" y="312" width="112" height="20" rx="2" fill="#f5f5f5"/>
  <text x="532" y="328" text-anchor="middle" fill="#3a7ca5" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">append / derive</text>
  <path d="M810 436 H864 Q872 436 872 428 V316 Q872 308 880 308 H900" fill="none" stroke="#2a9d8f" stroke-width="2" marker-end="url(#fig-04-arrow-green)"/>
  <rect x="820" y="356" width="40" height="20" rx="2" fill="#f5f5f5"/>
  <text x="840" y="372" text-anchor="middle" fill="#2a9d8f" font-size="12" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">调用</text>
  <path d="M900 268 H860 Q852 268 852 260 V212 Q852 204 844 204 H812" fill="none" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fig-04-arrow)"/>
  <rect x="848" y="224" width="40" height="20" rx="2" fill="#f5f5f5"/>
  <text x="868" y="240" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="Cascadia Mono,Consolas,monospace">input</text>

  <rect x="40" y="248" width="200" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
  <text x="64" y="288" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">CLI + Profile</text>
  <text x="64" y="316" fill="#4f5d75" font-size="14" font-family="Cascadia Mono,Consolas,monospace">bin.ts</text>
  <text x="64" y="340" fill="#4f5d75" font-size="14" font-family="Cascadia Mono,Consolas,monospace">→ profile-boot.ts</text>
  <rect x="330" y="176" width="480" height="124" rx="6" fill="#eeeafd" stroke="#6c63a8" stroke-width="2"/>
  <text x="354" y="216" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Base bundle plugins</text>
  <text x="354" y="248" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">LLM · Agent · Session · Tools</text>
  <text x="354" y="276" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">System Prompt · Agent Loop</text>
  <rect x="590" y="376" width="220" height="120" rx="6" fill="#e0f3ef" stroke="#2a9d8f" stroke-width="2"/>
  <text x="612" y="412" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Capability seams</text>
  <text x="612" y="444" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Definition · Provider</text>
  <text x="612" y="472" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Consumer · ctx.&lt;key&gt;</text>
  <rect x="330" y="376" width="230" height="120" rx="6" fill="#e3eff7" stroke="#3a7ca5" stroke-width="2"/>
  <text x="350" y="412" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Session log</text>
  <text x="350" y="444" fill="#4f5d75" font-size="16" font-family="Cascadia Mono,Consolas,monospace">append-only events</text>
  <text x="350" y="472" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">派生 model history</text>
  <rect x="900" y="232" width="220" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="924" y="272" fill="#2d3142" font-size="20" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Environment + UI</text>
  <text x="924" y="308" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Terminal · Filesystem</text>
  <text x="924" y="336" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Sandbox · User input</text>
  <line x1="40" y1="568" x2="1120" y2="568" stroke="rgba(45,49,66,.12)"/>
  <text x="300" y="604" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">教学边界：Agent handle / registry 与默认 agent-loop driver 是分开的；Cordis 不是操作系统。</text>
  <text x="300" y="644" fill="#7a8399" font-size="12" font-family="Cascadia Mono,Consolas,monospace">source baseline: cd5ef8148158c3a752a658978873241fdf8e2bbc</text>
