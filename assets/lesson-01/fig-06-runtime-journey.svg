<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="fig-06-title fig-06-desc">
  <title id="fig-06-title">一次 step 的运行时旅程</title>
  <desc id="fig-06-desc">用户输入先被记录并送给模型；若模型返回工具调用，Harness 在策略边界内执行、记录结果并继续推理，最终记录输出并返回用户。</desc>
  <defs>
    <marker id="f06-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="f06-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3a7ca5"/></marker>
    <marker id="f06-arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="f06-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9d8f"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#f5f5f5"/>
  <text x="48" y="52" fill="#2d3142" font-size="28" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">一次 step 的运行时旅程</text>
  <text x="48" y="84" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">静态架构真正“活起来”时，核心是记录 → 推理 → 可选行动 → 再记录。</text>

  <line x1="120" y1="144" x2="120" y2="760" stroke="rgba(45,49,66,.25)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="360" y1="144" x2="360" y2="760" stroke="rgba(45,49,66,.25)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="600" y1="144" x2="600" y2="760" stroke="rgba(45,49,66,.25)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="840" y1="144" x2="840" y2="760" stroke="rgba(45,49,66,.25)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1080" y1="144" x2="1080" y2="760" stroke="rgba(45,49,66,.25)" stroke-width="2" stroke-dasharray="6 6"/>

  <line x1="120" y1="200" x2="348" y2="200" stroke="#4f5d75" stroke-width="2" marker-end="url(#f06-arrow)"/>
  <text x="232" y="188" text-anchor="middle" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">输入一个 step</text>
  <line x1="360" y1="256" x2="588" y2="256" stroke="#3a7ca5" stroke-width="2" marker-end="url(#f06-arrow-blue)"/>
  <text x="472" y="244" text-anchor="middle" fill="#3a7ca5" font-size="16" font-family="Cascadia Mono,Consolas,monospace">append(user input)</text>
  <line x1="360" y1="312" x2="828" y2="312" stroke="#eb6c36" stroke-width="2" marker-end="url(#f06-arrow-orange)"/>
  <text x="592" y="300" text-anchor="middle" fill="#eb6c36" font-size="16" font-family="Cascadia Mono,Consolas,monospace">messages + tool schemas</text>
  <line x1="840" y1="368" x2="372" y2="368" stroke="#eb6c36" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f06-arrow-orange)"/>
  <text x="608" y="356" text-anchor="middle" fill="#eb6c36" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">tool call 或 final answer</text>

  <rect x="328" y="400" width="792" height="240" rx="6" fill="rgba(42,157,143,.03)" stroke="rgba(42,157,143,.55)" stroke-width="2"/>
  <rect x="328" y="400" width="160" height="28" rx="4" fill="#e0f3ef" stroke="rgba(42,157,143,.55)"/>
  <text x="344" y="420" fill="#2a9d8f" font-size="12" font-weight="600" font-family="Cascadia Mono,Consolas,monospace">OPT · TOOL CALL</text>
  <line x1="360" y1="464" x2="1068" y2="464" stroke="#2a9d8f" stroke-width="2" marker-end="url(#f06-arrow-green)"/>
  <text x="712" y="452" text-anchor="middle" fill="#2a9d8f" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">在策略边界内执行</text>
  <line x1="1080" y1="512" x2="372" y2="512" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f06-arrow-green)"/>
  <text x="724" y="500" text-anchor="middle" fill="#2a9d8f" font-size="16" font-family="Cascadia Mono,Consolas,monospace">tool result</text>
  <line x1="360" y1="560" x2="588" y2="560" stroke="#3a7ca5" stroke-width="2" marker-end="url(#f06-arrow-blue)"/>
  <text x="472" y="548" text-anchor="middle" fill="#3a7ca5" font-size="16" font-family="Cascadia Mono,Consolas,monospace">append(tool result)</text>
  <line x1="360" y1="608" x2="828" y2="608" stroke="#eb6c36" stroke-width="2" marker-end="url(#f06-arrow-orange)"/>
  <text x="592" y="596" text-anchor="middle" fill="#eb6c36" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">带结果继续推理</text>

  <line x1="360" y1="688" x2="588" y2="688" stroke="#3a7ca5" stroke-width="2" marker-end="url(#f06-arrow-blue)"/>
  <text x="472" y="676" text-anchor="middle" fill="#3a7ca5" font-size="16" font-family="Cascadia Mono,Consolas,monospace">append(output)</text>
  <line x1="360" y1="736" x2="132" y2="736" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f06-arrow)"/>
  <text x="244" y="724" text-anchor="middle" fill="#4f5d75" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">返回结果，等待下一 step</text>

  <rect x="52" y="112" width="136" height="48" rx="6" fill="#fff" stroke="#2d3142" stroke-width="2"/><rect x="276" y="112" width="168" height="48" rx="6" fill="rgba(45,49,66,.04)" stroke="#2d3142" stroke-width="2"/><rect x="532" y="112" width="136" height="48" rx="6" fill="#e3eff7" stroke="#3a7ca5" stroke-width="2"/><rect x="772" y="112" width="136" height="48" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="2"/><rect x="980" y="112" width="200" height="48" rx="6" fill="#e0f3ef" stroke="#2a9d8f" stroke-width="2"/>
  <text x="120" y="144" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">User</text><text x="360" y="144" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Agent / Harness</text><text x="600" y="144" text-anchor="middle" fill="#3a7ca5" font-size="16" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Session</text><text x="840" y="144" text-anchor="middle" fill="#eb6c36" font-size="16" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">LLM</text><text x="1080" y="144" text-anchor="middle" fill="#2a9d8f" font-size="16" font-weight="600" font-family="Noto Sans SC,Microsoft YaHei,sans-serif">Tools / Environment</text>
</svg>
